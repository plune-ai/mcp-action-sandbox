name: AC-8 header value stays out of the reports
# A fake credential (a constant, not a secret) in env; the server even repeats it in a tool result.
# The job searches the reports, the frame journal and the job summary; the run log, the artifacts
# and the PR comment are searched after the run.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SANDBOX_TOKEN: sandbox-fake-token-c6d72739f02a

jobs:
  http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the server
        run: node src/http-server.js clean --echo-auth --log "$RUNNER_TEMP/server.log" > "$RUNNER_TEMP/server.out" 2>&1 &
        env:
          PORT: '3000'
          MCP_AUTH_TOKEN: ${{ env.SANDBOX_TOKEN }}
      - id: mcp
        uses: plune-ai/eval-action/mcp@v1
        with:
          server-url: http://127.0.0.1:3000/mcp
          headers-from-env: Authorization=SANDBOX_AUTHORIZATION
          smoke: 'true'
          debug-artifact: 'true'
          comment: 'false'
          artifact-name: ac08-http
        env:
          SANDBOX_AUTHORIZATION: Bearer ${{ env.SANDBOX_TOKEN }}
      - name: The value is in no report, frame journal or summary
        env:
          REPORT_DIR: ${{ steps.mcp.outputs.report-dir }}
        run: |
          set -eu
          grep -q '"tool":"whoami"' "$RUNNER_TEMP/server.log"
          hits=$( (grep -rlF "$SANDBOX_TOKEN" "$REPORT_DIR" "$RUNNER_TEMP/plune-mcp-debug" "$RUNNER_TEMP"/_runner_file_commands/step_summary_* 2>/dev/null || true) | wc -l)
          echo "files holding the value: $hits"
          test "$hits" = 0
