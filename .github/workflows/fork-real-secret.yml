name: Fork pull request, real secret missing
# On a pull request from a fork GitHub passes no repository secrets, so the real MCP_AUTHORIZATION
# secret arrives empty. The action must stop before the server gets a request, naming the variable.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  real-secret:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the server
        run: node src/http-server.js clean --log "$RUNNER_TEMP/server.log" > "$RUNNER_TEMP/server.out" 2>&1 &
        env:
          PORT: '3000'
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
      - name: The server is up
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            if [ "$code" = 404 ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - id: mcp
        continue-on-error: true
        uses: plune-ai/eval-action/mcp@v1
        with:
          server-url: http://127.0.0.1:3000/mcp
          headers-from-env: Authorization=MCP_AUTHORIZATION
          comment: 'false'
          artifact-name: fork-real-secret
        env:
          MCP_AUTHORIZATION: ${{ secrets.MCP_AUTHORIZATION }}
      - name: Red, not measured, no request reached the server
        env:
          OUTCOME: ${{ steps.mcp.outcome }}
          MEASURED: ${{ steps.mcp.outputs.measured }}
          SUMMARY: ${{ steps.mcp.outputs.summary }}
        run: |
          set -eu
          echo "outcome=$OUTCOME measured=$MEASURED summary=$SUMMARY"
          test "$OUTCOME" = failure
          test "$MEASURED" = false
          grep -F 'MCP_AUTHORIZATION' <<< "$SUMMARY"
          lines=$(cat "$RUNNER_TEMP/server.log" 2>/dev/null | wc -l)
          echo "server journal lines: $lines"
          test "$lines" = 0
