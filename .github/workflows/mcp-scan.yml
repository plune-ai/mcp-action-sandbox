name: mcp-scan
on: [pull_request]
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: npx -y @plune-ai/cli@0.39.4 mcp snapshot --out current.json -- node dist/server.js
      - run: npx -y @plune-ai/cli@0.39.4 mcp scan --snapshot current.json --pin-file plune-mcp.lock.json --format github --out sarif=scan.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: scan.sarif
