# The HTTP example from https://docs.plune.ai/cli/guides/mcp-conformance/ ("In CI"), its steps put
# into the stdio example's job. Sandbox changes: the server started is dist/http-server.js (this
# repository's HTTP server; dist/server.js is its stdio one), and the `echo` line prints the exit code.
name: MCP conformance (HTTP)
on:
  pull_request:
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Start the server
        run: node dist/http-server.js &
      - name: Wait for it
        run: |
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:3000/mcp && break; sleep 1; done
      - name: Check the server against the spec
        run: |
          code=0
          npx -y @plune-ai/cli mcp conformance --url http://127.0.0.1:3000/mcp --out junit-xml=conformance.xml || code=$?
          echo "conformance exit code: $code"
          if [ "$code" -eq 1 ] || [ "$code" -eq 2 ]; then exit "$code"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-conformance-http
          path: conformance.xml
